# TurnCall on Kubernetes, and optionally the builder beside it. Postgres (with
# pgvector) and Redis are external unless postgresql/redis are enabled: point
# DATABASE_URL and REDIS_URL at them. README.md; TurnCall's
# docs/guides/kubernetes.mdx.

# Published by kobikis/turncall: a release tag (2.2.0), or `main` / `sha-<commit>`
# from its main branch. linux/amd64 only.
image:
  repository: ghcr.io/kobikis/turncall
  # Empty = the chart's appVersion (`2.2.0`). Pin a release or a sha- tag
  # rather than `main`: a node keeps the first `main` it pulled under
  # IfNotPresent.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The public https URL carriers reach this API at (PUBLIC_BASE_URL): Twilio and
# Telnyx webhooks, media streams, transfer callbacks. Without it a number
# cannot be configured on bind. The builder shows it as a number's webhook.
# config.PUBLIC_BASE_URL wins when both are set.
publicBaseUrl: ""

# The prefix of every object's name, instead of <release>-turncall (or the
# release name when it contains "turncall").
fullnameOverride: ""

# Plain settings, as environment variables, shared by every TurnCall process
# (CLAUDE.md "Environment Variables"). TURNCALL_ENV, PORT and
# ASTERISK_EDGE_ENABLED are set by the chart per Deployment and cannot be
# overridden here.
config:
  # Every replica must see the same objects (recordings, KB files, ambience):
  # `local` storage is one pod's filesystem, so use S3 with more than one pod.
  STORAGE_BACKEND: s3
  # S3_BUCKET_NAME: turncall-recordings
  # AWS_REGION: us-east-1
  # PUBLIC_BASE_URL: https://turncall.example.com

# Secrets, as environment variables: DATABASE_URL, REDIS_URL, PLATFORM_API_KEY,
# API_KEY_HASH_SECRET, CREDENTIAL_ENCRYPTION_KEY, provider keys. The chart
# stores them in a Secret it owns. In production prefer `existingSecret`.
secretEnv: {}
  # DATABASE_URL: postgresql+asyncpg://turncall:...@postgres:5432/turncall
  # REDIS_URL: redis://redis:6379/0

# The name of a Secret you manage, holding the same keys as `secretEnv`. Used
# instead of `secretEnv` when set. It must hold DATABASE_URL: the migration
# Job reads it from there.
existingSecret: ""

# In-cluster Postgres (pgvector) and Redis, the docker compose stack's two
# services, for a laptop or a single-node install (values-local.yaml). Each is
# one pod on one volume: no replication, no backups. In production leave them
# off and point DATABASE_URL / REDIS_URL at managed ones.
#
# Enabled, the chart fills DATABASE_URL / REDIS_URL in its own Secret unless
# secretEnv sets them (an existingSecret must hold them itself), and the API
# migrates in an init container instead of the hook Job: a pre-install hook
# runs before the database it would migrate exists.
postgresql:
  enabled: false
  image: pgvector/pgvector:pg16
  user: turncall
  password: turncall
  database: turncall
  storage: 8Gi
  resources: {}

redis:
  enabled: false
  image: redis:7-alpine
  storage: 1Gi
  resources: {}

# STORAGE_BACKEND=local on a volume, mounted at the API's /app/storage. A
# ReadWriteOnce volume is one pod's: keep api.replicas at 1 (S3 otherwise).
localStorage:
  enabled: false
  size: 10Gi

# The longest `max_call_duration_seconds` among your agents (the agent
# default is 3600, the maximum 14400). It sizes the API pods' grace period:
# preStopSeconds + this + 90 (#199). Kubernetes SIGKILLs a pod at the end of
# its grace period, which drops its calls, so set it from your agents.
maxCallDurationSeconds: 3600

api:
  # Ignored while autoscaling is enabled: the HPA owns the count.
  replicas: 2
  # How long a terminating pod keeps serving before SIGTERM, while it leaves
  # the Service's endpoints and load balancers catch up. It also covers the gap
  # between Twilio receiving TwiML and opening the media stream, which is not
  # yet a counted call.
  preStopSeconds: 10
  # Sized from the calls-per-pod measurement (#200, docs/guides/capacity.mdx).
  # No CPU limit, on purpose: a CFS quota freezes the whole process for the
  # rest of a 100ms period whenever it bursts past it, and every call's audio
  # runs on that one event loop, so each throttle is a gap on every call at
  # once. Under `limits.cpu: 1` a pod carried 1 call cleanly where the same
  # core without a quota carried 2, and a second core of quota did not help
  # (the loop is single-threaded). Memory: ~265 MiB + ~45 MiB per call (#271),
  # so 1Gi covers the target with room; the limit is higher because hitting it
  # is an OOM kill, which drops every call on the pod at once.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 80

# Scale the API on live calls per pod, not CPU. Needs the custom metrics API to
# serve `turncall_active_calls` for pods (prometheus-adapter); a KEDA
# ScaledObject is the alternative, in docs/guides/kubernetes.mdx.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  # The average live calls per API pod the HPA holds the Deployment to.
  # #200 measured 2 clean concurrent calls (default cascade agent: Silero VAD,
  # Smart Turn, recording) on one dedicated core with no CPU quota, and the
  # first audio gaps at 4. Measured on an Apple M1 Pro, in a Docker Desktop VM
  # with 8 vCPU, on a noisy host, so treat it as a floor and re-measure on
  # your node type (`make load-test`; docs/guides/capacity.mdx).
  activeCallsPerPod: 2
  # A pod removed by a scale-down drains for as long as its longest call, so
  # scaling down slowly saves churning pods that would only drain.
  scaleDownStabilizationSeconds: 600

# Asterisk's ARI edge (#209). ARI gives an app's calls to the newest
# connection only, so exactly one process may hold it: with this enabled, a
# separate single-replica Deployment runs it, and every API pod runs with the
# edge off. Enable it if the platform or any project uses Asterisk; with it
# disabled, no process connects to Asterisk.
asteriskEdge:
  enabled: false
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Eval runs (ADR-0018): never in the API process.
evalWorker:
  enabled: true
  replicas: 1
  # Audio-modality runs and the `jev` judge need an image built with
  # INSTALL_EXTRAS=evals-audio,evals-jev; the released image has neither.
  image: {}
    # repository: registry.example.com/turncall-eval
    # tag: "2.2.0"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Shared with the API, which validates a run's iterations against the cap.
# They also size the eval worker's grace period: on SIGTERM it finishes the
# runs it holds, and the longest a run may take is
# max(maxRunDurationSeconds, 180 x maxIterations) + 60s.
evals:
  maxIterations: 50
  maxRunDurationSeconds: 900

# Campaign dialling (#229): its own process, any number of replicas (targets
# are claimed with SKIP LOCKED).
campaignWorker:
  enabled: true
  replicas: 1
  # SIGTERM is honoured between passes, so a dial in progress is recorded
  # before the process exits. A pass at the default pacing takes seconds; one
  # with pacing off (CAMPAIGN_DEFAULT_CALLS_PER_SECOND=0) dials until its
  # campaigns run out of work, so raise this if you turn pacing off.
  terminationGracePeriodSeconds: 60
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# `alembic upgrade head` as a pre-install/pre-upgrade hook, before any pod of
# the new version starts.
migrations:
  enabled: true
  resources: {}

# Carriers and browsers reach the API here. Twilio's media streams are
# WebSockets that last a whole call: raise the controller's proxy timeouts to
# at least maxCallDurationSeconds, e.g. for ingress-nginx:
#   nginx.ingress.kubernetes.io/proxy-read-timeout: "3700"
#   nginx.ingress.kubernetes.io/proxy-send-timeout: "3700"
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: turncall.example.com
  # What the Ingress routes, by prefix: the API, the carriers' webhooks and
  # their media streams. Never `/`: /metrics, /ready, /live and /health carry
  # no credential (a probe cannot present one) and say how many calls a pod
  # is carrying, so they stay in-cluster — the kubelet and the PodMonitor
  # reach the pod directly. Add `/docs` and `/openapi.json` to publish those.
  paths:
    - /v1
    - /webhooks
    - /ws
  tls: []
    # - secretName: turncall-tls
    #   hosts: [turncall.example.com]

# A prometheus-operator PodMonitor scraping /metrics on every API pod. The
# gauge is per process, so it is scraped per pod, never through the Service.
podMonitor:
  enabled: false
  interval: 15s
  labels: {}

# The builder (turncall-builder-api + turncall-builder-web): builder-api, the
# console, and each agent's generated backend, which builder-api runs as a
# Deployment + Service in this namespace (turncall-builder-api ADR-0025) with a
# Role over just those objects. Off: TurnCall alone.
#
# It talks to this release's TurnCall and takes TurnCall's PLATFORM_API_KEY
# from TurnCall's Secret. With postgresql.enabled its database is `builder` on
# that Postgres, created on first start; otherwise set DATABASE_URL.
builder:
  enabled: false

  api:
    image:
      repository: ghcr.io/kobikis/turncall-builder-api
      tag: "1.0.0"
      pullPolicy: IfNotPresent
    resources: {}

  web:
    image:
      repository: ghcr.io/kobikis/turncall-builder-web
      tag: "1.0.0"
      pullPolicy: IfNotPresent
    resources: {}

  # The builder's images are published by its repos (amd64 + arm64): a release
  # tag, or `main` / `sha-<commit>`. They are private packages: put a ghcr
  # login in imagePullSecrets.
  #
  # The image every Agent Backend runs (turncall-builder-api's
  # agent-runtime/Dockerfile): the scaffold's requirements, each backend's
  # code mounted from a ConfigMap. imagePullSecrets above reach these pods too.
  agentRuntime:
    image: ghcr.io/kobikis/turncall-agent-runtime:1.0.0
    dataSize: 1Gi
    # How long a build or restart waits for the backend's pod to be ready
    # before the agent reads as failed.
    readyTimeoutSeconds: 180

  # The namespace Agent Backends run in. Empty = this release's. In
  # production give them one of their own (create it first): they run code
  # the Builder generated, and builder-api's Role — which covers Secrets —
  # is granted there instead of beside TurnCall's Secret.
  agentNamespace: ""

  # Generated repos: the user's code, committed on every generation. Kept on
  # `helm uninstall`.
  generated:
    size: 5Gi

  # Plain settings: AGENT_TIMEZONE, BUILDER_PROVIDER, BUILDER_MODEL,
  # PUBLIC_BASE_URL (the console's URL), GOOGLE_REDIRECT_URI,
  # PIPEDREAM_REDIRECT_URI, TURNCALL_ENV… (turncall-builder-api .env.example).
  # The chart sets BACKEND_RUNTIME, AGENT_*, BUILDER_URL, GENERATED_DIR,
  # TURNCALL_BASE_URL and TURNCALL_PUBLIC_URL (from publicBaseUrl).
  config: {}

  # Secrets: ANTHROPIC_API_KEY / OPENAI_API_KEY, BUILDER_SESSION_SECRET,
  # INTEGRATIONS_ENCRYPTION_KEY, GOOGLE_CLIENT_ID/SECRET, PIPEDREAM_*, and
  # DATABASE_URL unless postgresql.enabled fills it.
  secretEnv: {}

  # A Secret you manage with the same keys, used instead of secretEnv.
  existingSecret: ""

  # The console, which also proxies /api to builder-api: the only service a
  # browser needs, OAuth and Pipedream callbacks included (/api/...). A
  # builder turn streams for minutes: raise the controller's read timeout and
  # turn buffering off, e.g. for ingress-nginx:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: builder.example.com
    tls: []
