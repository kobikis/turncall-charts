{{- if .Values.builder.enabled }}
{{- if not (or .Values.builder.existingSecret .Values.builder.secretEnv.DATABASE_URL .Values.postgresql.enabled) }}
{{- fail "builder: set builder.secretEnv.DATABASE_URL, builder.existingSecret naming a Secret that holds it, or postgresql.enabled" }}
{{- end }}
{{- if not .Values.builder.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "builder.fullname" . }}
  labels:
    {{- include "builder.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := include "builder.secretEnv" . | fromYaml }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
