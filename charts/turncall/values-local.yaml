# Everything, in the cluster — TurnCall with its own Postgres and Redis, and
# the builder — the docker compose stacks on Kubernetes (Docker Desktop, kind,
# minikube). Not for production: Postgres and Redis are one pod each, files
# are on one volume, the secrets are dev values. README.md.
#
#   helm install turncall charts/turncall -n turncall --create-namespace \
#     -f charts/turncall/values-local.yaml -f my-keys.yaml
#
# The images are local tags (the released TurnCall image is amd64 only);
# point each at your registry's instead. TurnCall alone: --set builder.enabled=false.
# pullPolicy Always: Docker Desktop's cluster pulls local tags from the Docker
# engine, so a rebuilt image is picked up on the next pod start (`kubectl
# rollout restart deploy`); with IfNotPresent a node keeps a tag's first build
# for good. On kind or minikube, with images loaded onto the nodes, set
# IfNotPresent.
image:
  repository: turncall
  tag: dev
  pullPolicy: Always

postgresql:
  enabled: true
redis:
  enabled: true
localStorage:
  enabled: true

config:
  STORAGE_BACKEND: local

# Phone calls need a public https URL that reaches this API: turn on the
# in-cluster ngrok tunnel in your keys file —
#   tunnel: {enabled: true, domain: <name>.ngrok-free.dev, authtoken: ...}
# — and that domain becomes publicBaseUrl. Without one, binding a number saves
# it unconfigured.
publicBaseUrl: ""

# Dev values. Provider keys go here too (OPENAI_API_KEY, DEEPGRAM_API_KEY,
# TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, ...) — keep them in a file of your
# own passed as a second -f, not in this one.
secretEnv:
  API_KEY_HASH_SECRET: turncall-local-dev-pepper-do-not-change
  PLATFORM_API_KEY: turncall-local-platform-key
  # Fernet key, dev only. Never rotate it once credentials are stored.
  CREDENTIAL_ENCRYPTION_KEY: MBH9WQ_Nj4EVJvaKpupko4y_7wNcF33eaCeFBF_EgoE=

api:
  replicas: 1
  # Room for the rest on a laptop; the production request is a whole core.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# One short drain instead of an hour: a laptop restart should not wait on it.
maxCallDurationSeconds: 600

builder:
  enabled: true
  api:
    image: {repository: turncall-builder-api, tag: dev, pullPolicy: Always}
  web:
    image: {repository: turncall-builder-web, tag: dev, pullPolicy: Always}
  agentRuntime:
    image: turncall-agent-runtime:dev
  config:
    AGENT_TIMEZONE: UTC
  # Dev values. ANTHROPIC_API_KEY (or OPENAI_API_KEY) goes in your own file:
  #   builder: {secretEnv: {ANTHROPIC_API_KEY: ...}}
  secretEnv:
    BUILDER_SESSION_SECRET: builder-local-dev-session-secret
    INTEGRATIONS_ENCRYPTION_KEY: ZiqiQs9DmIlqu2QkparasbHLGeE1yJW94iVx0muKGqE=
