name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint the chart and render it with every values file, so a template error
  # fails here rather than at someone's `helm install`. Pinned so an upstream
  # release cannot turn the build red on its own.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Lint and render every values file
        run: |
          for f in charts/turncall/values-local.yaml charts/turncall/values-production.yaml \
                   charts/turncall/ci/full-values.yaml charts/turncall/ci/existing-secret-values.yaml; do
            echo "::group::$f"
            helm lint --strict charts/turncall -f "$f"
            helm template turncall charts/turncall -f "$f" > /dev/null
            echo "::endgroup::"
          done
      # The probes and /metrics need no credential, so they never reach the
      # public Ingress: no rule may route `/` or one of them.
      - run: |
          ! helm template turncall charts/turncall -f charts/turncall/ci/full-values.yaml \
            -s templates/ingress.yaml | grep -E 'path: /(metrics|ready|live|health)?$'
      # The builder is off unless asked for: TurnCall installs alone.
      - run: |
          ! helm template turncall charts/turncall --set secretEnv.DATABASE_URL=postgresql://x \
            | grep -q 'turncall-builder'

  # Every commit carries a DCO sign-off, as in the product repos. Plain bash so
  # there is no third-party action in the supply chain.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check commits are signed off
        run: |
          # The branch tip, not HEAD: checkout resolves a PR to a synthetic
          # merge commit that carries no sign-off of its own.
          head='${{ github.event.pull_request.head.sha }}'
          base=$(git merge-base origin/${{ github.base_ref }} "$head")
          missing=$(git log --no-merges --format='%H %s' \
            --invert-grep --grep='^Signed-off-by: .\+ <.\+@.\+>$' "$base".."$head")
          if [ -n "$missing" ]; then
            echo "::error::Commits missing a Signed-off-by trailer:"
            echo "$missing"
            echo "Fix with: git commit --amend -s   (or git rebase --signoff $base)"
            exit 1
          fi
          echo "All commits signed off."
