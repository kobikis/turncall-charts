name: Publish

# A tag v0.2.0 publishes the chart at that version to
# oci://ghcr.io/kobikis/charts/turncall. The tag must equal Chart.yaml's
# version, so a release can never publish a chart that calls itself
# something else.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read
  packages: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: The tag is the chart's version
        run: |
          version=$(sed -n 's/^version: *//p' charts/turncall/Chart.yaml | tr -d '"')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but charts/turncall/Chart.yaml says version $version"
            exit 1
          fi
      - run: helm lint --strict charts/turncall -f charts/turncall/ci/full-values.yaml
      - run: helm package charts/turncall --destination dist
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: helm push dist/turncall-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
